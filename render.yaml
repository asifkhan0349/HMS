services:
  - type: web
    runtime: python
    name: hms-api
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: HMS_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    runtime: static
    name: hms-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
