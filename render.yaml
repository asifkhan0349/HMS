services:
  - type: web
    runtime: python
    name: hms-api
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT app.main:app
    healthCheckPath: /api/health
    envVars:
      - key: HMS_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hms-db
          property: connectionString

  - type: web
    runtime: static
    name: hms-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hms-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: static
    name: hms-landing
    rootDir: landing
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_APP_URL
        fromService:
          name: hms-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: hms-db
    plan: free
    databaseName: hms_postgres
    user: hms_user
