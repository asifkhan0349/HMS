services:
  hms-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env          # Never committed — contains real secrets
    environment:
      - ENV=production
    depends_on:
      hms-db:
        condition: service_healthy   # Wait until Postgres is actually ready
    restart: unless-stopped

  hms-db:
    image: postgres:15-alpine
    env_file:
      - ./backend/.env          # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB loaded from here
    volumes:
      - hms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  hms-db-data:
