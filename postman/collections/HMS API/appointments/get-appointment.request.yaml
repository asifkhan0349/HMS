$kind: http-request
name: Get Appointment
method: GET
url: '{{baseUrl}}/api/appointments/{{appointmentId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // â”€â”€â”€ Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      const res    = pm.response;
      const json   = res.json();
      const SLA_MS = 2000;
      
      // â”€â”€â”€ 1. Status & Protocol â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[Get Appointment] Status code is 200", () => {
          res.to.have.status(200);
      });
      
      pm.test("[Get Appointment] Content-Type is application/json", () => {
          pm.expect(res.headers.get("Content-Type")).to.include("application/json");
      });
      
      pm.test("[Get Appointment] Response time is within SLA (" + SLA_MS + "ms)", () => {
          pm.expect(res.responseTime).to.be.below(SLA_MS);
      });
      
      // â”€â”€â”€ 2. Schema Assertions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[Get Appointment] Response body is a JSON object", () => {
          pm.expect(json).to.be.an("object");
      });
      
      pm.test("[Get Appointment] Response has 'id' matching appointmentId variable", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
          const storedId = pm.collectionVariables.get("appointmentId");
          if (storedId) {
              pm.expect(String(json.id)).to.equal(storedId);
          }
      });
      
      pm.test("[Get Appointment] Response has required appointment fields", () => {
          pm.expect(json).to.have.property("patient_id");
          pm.expect(json).to.have.property("doctor_id");
          pm.expect(json).to.have.property("status");
          pm.expect(json).to.have.property("date");
      });
      
      pm.test("[Get Appointment] Status is a valid appointment status", () => {
          const validStatuses = ["scheduled", "completed", "cancelled", "pending"];
          pm.expect(validStatuses).to.include(json.status);
      });