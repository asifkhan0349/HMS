$kind: http-request
name: Delete Appointment
method: DELETE
url: '{{baseUrl}}/api/appointments/{{appointmentId}}'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // â”€â”€â”€ Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      const res    = pm.response;
      const json   = res.json();
      const SLA_MS = 2000;
      
      // â”€â”€â”€ 1. Status & Protocol â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[Delete Appointment] Status code is 200", () => {
          res.to.have.status(200);
      });
      
      pm.test("[Delete Appointment] Content-Type is application/json", () => {
          pm.expect(res.headers.get("Content-Type")).to.include("application/json");
      });
      
      pm.test("[Delete Appointment] Response time is within SLA (" + SLA_MS + "ms)", () => {
          pm.expect(res.responseTime).to.be.below(SLA_MS);
      });
      
      // â”€â”€â”€ 2. Schema Assertions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[Delete Appointment] Response body is a JSON object", () => {
          pm.expect(json).to.be.an("object");
      });
      
      pm.test("[Delete Appointment] Response contains confirmation message or id", () => {
          const hasConfirmation = json.hasOwnProperty("message") || json.hasOwnProperty("detail") || json.hasOwnProperty("id");
          pm.expect(hasConfirmation, "Expected message, detail, or id in delete response").to.be.true;
      });
      
      // â”€â”€â”€ 3. Cleanup â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.collectionVariables.unset("appointmentId");