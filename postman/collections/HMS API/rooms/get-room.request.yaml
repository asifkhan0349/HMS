$kind: http-request
name: Get Room
method: GET
url: '{{baseUrl}}/api/rooms/{{roomId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Get Room] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Get Room] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Get Room] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Get Room] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Get Room] Response has 'id' matching roomId variable", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
          const storedId = pm.collectionVariables.get("roomId");
          if (storedId) { pm.expect(String(json.id)).to.equal(storedId); }
      });
      pm.test("[Get Room] Response has required room fields", () => {
          pm.expect(json).to.have.property("room_number");
          pm.expect(json).to.have.property("type");
          pm.expect(json).to.have.property("status");
          pm.expect(json).to.have.property("capacity");
      });