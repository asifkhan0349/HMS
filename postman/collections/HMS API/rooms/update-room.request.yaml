$kind: http-request
name: Update Room
method: PUT
url: '{{baseUrl}}/api/rooms/{{roomId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "occupied",
      "capacity": 3
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Update Room] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Update Room] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Update Room] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Update Room] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Update Room] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Update Room] Updated status is reflected in response", () => {
          pm.expect(json).to.have.property("status");
          pm.expect(json.status).to.equal("occupied");
      });
      pm.test("[Update Room] Updated capacity is reflected in response", () => {
          pm.expect(json).to.have.property("capacity");
          pm.expect(json.capacity).to.equal(3);
      });