$kind: http-request
name: Create Room
method: POST
url: '{{baseUrl}}/api/rooms'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "room_number": "101",
      "type": "general",
      "status": "available",
      "floor": 1,
      "capacity": 2
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Create Room] Status code is 201", () => { res.to.have.status(201); });
      pm.test("[Create Room] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Create Room] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Create Room] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Create Room] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Create Room] Response has required room fields", () => {
          pm.expect(json).to.have.property("room_number");
          pm.expect(json).to.have.property("type");
          pm.expect(json).to.have.property("status");
          pm.expect(json).to.have.property("capacity");
          pm.expect(json.room_number).to.be.a("string").and.not.empty;
          pm.expect(json.capacity).to.be.a("number").and.above(0);
      });
      pm.test("[Create Room] Status is a valid room status", () => {
          const validStatuses = ["available", "occupied", "maintenance", "reserved"];
          pm.expect(validStatuses).to.include(json.status);
      });
      pm.test("[Create Room] Response has created_at timestamp", () => {
          const hasTimestamp = json.hasOwnProperty("created_at") || json.hasOwnProperty("createdAt");
          pm.expect(hasTimestamp, "Expected created_at or createdAt").to.be.true;
      });
      pm.test("[Create Room] roomId is set in collection variables", () => {
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("roomId", String(json.id));
          pm.collectionVariables.set("lastResourceId", String(json.id));
          pm.expect(pm.collectionVariables.get("roomId")).to.equal(String(json.id));
      });