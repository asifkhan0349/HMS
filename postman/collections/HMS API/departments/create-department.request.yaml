$kind: http-request
name: Create Department
method: POST
url: '{{baseUrl}}/api/departments'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Cardiology",
      "description": "Heart and cardiovascular care",
      "head_doctor_id": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Create Department] Status code is 201", () => { res.to.have.status(201); });
      pm.test("[Create Department] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Create Department] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Create Department] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Create Department] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Create Department] Response has required department fields", () => {
          pm.expect(json).to.have.property("name");
          pm.expect(json).to.have.property("description");
          pm.expect(json.name).to.be.a("string").and.not.empty;
          pm.expect(json.name).to.equal("Cardiology");
      });
      pm.test("[Create Department] Response has created_at timestamp", () => {
          const hasTimestamp = json.hasOwnProperty("created_at") || json.hasOwnProperty("createdAt");
          pm.expect(hasTimestamp, "Expected created_at or createdAt").to.be.true;
      });
      pm.test("[Create Department] departmentId is set in collection variables", () => {
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("departmentId", String(json.id));
          pm.collectionVariables.set("lastResourceId", String(json.id));
          pm.expect(pm.collectionVariables.get("departmentId")).to.equal(String(json.id));
      });