$kind: http-request
name: Delete Department
method: DELETE
url: '{{baseUrl}}/api/departments/{{departmentId}}'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Delete Department] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Delete Department] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Delete Department] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Delete Department] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Delete Department] Response contains confirmation message or id", () => {
          const hasConfirmation = json.hasOwnProperty("message") || json.hasOwnProperty("detail") || json.hasOwnProperty("id");
          pm.expect(hasConfirmation, "Expected message, detail, or id in delete response").to.be.true;
      });
      pm.collectionVariables.unset("departmentId");