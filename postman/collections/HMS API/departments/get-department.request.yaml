$kind: http-request
name: Get Department
method: GET
url: '{{baseUrl}}/api/departments/{{departmentId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Get Department] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Get Department] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Get Department] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Get Department] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Get Department] Response has 'id' matching departmentId variable", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
          const storedId = pm.collectionVariables.get("departmentId");
          if (storedId) { pm.expect(String(json.id)).to.equal(storedId); }
      });
      pm.test("[Get Department] Response has required department fields", () => {
          pm.expect(json).to.have.property("name");
          pm.expect(json).to.have.property("description");
          pm.expect(json.name).to.be.a("string").and.not.empty;
      });