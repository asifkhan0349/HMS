$kind: http-request
name: Update Department
method: PUT
url: '{{baseUrl}}/api/departments/{{departmentId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "description": "Advanced heart and cardiovascular care"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Update Department] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Update Department] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Update Department] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Update Department] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Update Department] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Update Department] Updated description is reflected in response", () => {
          pm.expect(json).to.have.property("description");
          pm.expect(json.description).to.equal("Advanced heart and cardiovascular care");
      });