$kind: http-request
name: Health Check
method: GET
url: '{{baseUrl}}/api/health'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Health Check] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Health Check] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Health Check] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Health Check] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Health Check] Response contains status field", () => {
          pm.expect(json).to.have.property("status");
          pm.expect(json.status).to.be.a("string").and.not.empty;
      });
      pm.test("[Health Check] Service status is healthy", () => {
          const healthyValues = ["ok", "healthy", "up", "running"];
          pm.expect(healthyValues).to.include(json.status.toLowerCase());
      });
      pm.test("[Health Check] Response has no error indicators", () => {
          pm.expect(json).to.not.have.property("error");
          pm.expect(json).to.not.have.property("exception");
      });