$kind: http-request
name: Get Lab Test
method: GET
url: '{{baseUrl}}/api/lab-tests/{{labTestId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Get Lab Test] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Get Lab Test] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Get Lab Test] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Get Lab Test] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Get Lab Test] Response has 'id' matching labTestId variable", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
          const storedId = pm.collectionVariables.get("labTestId");
          if (storedId) { pm.expect(String(json.id)).to.equal(storedId); }
      });
      pm.test("[Get Lab Test] Response has required lab test fields", () => {
          pm.expect(json).to.have.property("patient_id");
          pm.expect(json).to.have.property("test_name");
          pm.expect(json).to.have.property("status");
      });
      pm.test("[Get Lab Test] Status is a valid lab test status", () => {
          const validStatuses = ["pending", "in_progress", "completed", "cancelled"];
          pm.expect(validStatuses).to.include(json.status);
      });