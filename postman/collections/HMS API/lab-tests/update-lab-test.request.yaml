$kind: http-request
name: Update Lab Test
method: PUT
url: '{{baseUrl}}/api/lab-tests/{{labTestId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "completed",
      "result": "Normal"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Update Lab Test] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Update Lab Test] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Update Lab Test] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Update Lab Test] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Update Lab Test] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Update Lab Test] Updated status is reflected in response", () => {
          pm.expect(json).to.have.property("status");
          pm.expect(json.status).to.equal("completed");
      });