$kind: http-request
name: List Lab Tests
method: GET
url: '{{baseUrl}}/api/lab-tests'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[List Lab Tests] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[List Lab Tests] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[List Lab Tests] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[List Lab Tests] Response is an array", () => { pm.expect(json).to.be.an("array"); });
      pm.test("[List Lab Tests] Each lab test has required fields", () => {
          if (json.length > 0) {
              const lt = json[0];
              pm.expect(lt).to.have.property("id");
              pm.expect(lt).to.have.property("patient_id");
              pm.expect(lt).to.have.property("test_name");
              pm.expect(lt).to.have.property("status");
              pm.expect(lt.id).to.be.a("number");
          }
      });
      pm.test("[List Lab Tests] Array items have numeric ids", () => {
          json.forEach((item, idx) => { pm.expect(item.id, "item[" + idx + "].id").to.be.a("number"); });
      });
      if (json.length > 0) { pm.collectionVariables.set("lastResourceId", String(json[0].id)); }