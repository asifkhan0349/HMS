$kind: http-request
name: Create Lab Test
method: POST
url: '{{baseUrl}}/api/lab-tests'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "patient_id": 1,
      "test_name": "Complete Blood Count",
      "status": "pending",
      "ordered_by": 1,
      "notes": "Routine CBC"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Create Lab Test] Status code is 201", () => { res.to.have.status(201); });
      pm.test("[Create Lab Test] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Create Lab Test] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Create Lab Test] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Create Lab Test] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Create Lab Test] Response has required lab test fields", () => {
          pm.expect(json).to.have.property("patient_id");
          pm.expect(json).to.have.property("test_name");
          pm.expect(json).to.have.property("status");
          pm.expect(json.patient_id).to.be.a("number");
          pm.expect(json.test_name).to.be.a("string").and.not.empty;
          pm.expect(json.status).to.equal("pending");
      });
      pm.test("[Create Lab Test] Response has created_at timestamp", () => {
          const hasTimestamp = json.hasOwnProperty("created_at") || json.hasOwnProperty("createdAt");
          pm.expect(hasTimestamp, "Expected created_at or createdAt").to.be.true;
      });
      pm.test("[Create Lab Test] labTestId is set in collection variables", () => {
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("labTestId", String(json.id));
          pm.collectionVariables.set("lastResourceId", String(json.id));
          pm.expect(pm.collectionVariables.get("labTestId")).to.equal(String(json.id));
      });