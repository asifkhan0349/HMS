$kind: http-request
name: Update Profile
method: PATCH
url: '{{baseUrl}}/api/auth/profile'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "updateduser",
      "email": "updated@hospital.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // --- Helpers ---
      const res    = pm.response;
      const json   = res.json();
      const SLA_MS = 2000;
      // --- 1. Status & Protocol ---
      pm.test("[Update Profile] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Update Profile] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Update Profile] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      // --- 2. Schema Assertions ---
      pm.test("[Update Profile] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Update Profile] Response contains 'user' object", () => { pm.expect(json).to.have.property("user"); pm.expect(json.user).to.be.an("object"); });
      pm.test("[Update Profile] User object has required fields (id, username, email)", () => { pm.expect(json.user).to.have.property("id"); pm.expect(json.user).to.have.property("username"); pm.expect(json.user).to.have.property("email"); pm.expect(json.user.username).to.be.a("string").and.not.empty; pm.expect(json.user.email).to.be.a("string").and.include("@"); });
      // --- 3. Variable Chaining ---
      pm.test("[Update Profile] lastResourceId is set in collection variables", () => { pm.expect(json.user.id).to.exist; pm.collectionVariables.set("lastResourceId", String(json.user.id)); pm.expect(pm.collectionVariables.get("lastResourceId")).to.equal(String(json.user.id)); });