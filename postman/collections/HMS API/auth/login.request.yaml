$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "admin_hms",
      "password": "ham33dSh@ika7m1n4m5"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // --- Helpers ---
      const res        = pm.response;
      const json       = res.json();
      const SLA_MS     = 2000;
      // --- 1. Status & Protocol ---
      pm.test("[Login] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Login] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Login] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      // --- 2. Schema Assertions ---
      pm.test("[Login] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Login] Response contains 'token' field", () => { pm.expect(json).to.have.property("token"); pm.expect(json.token).to.be.a("string").and.not.empty; });
      pm.test("[Login] Response contains 'user' object", () => { pm.expect(json).to.have.property("user"); pm.expect(json.user).to.be.an("object"); });
      pm.test("[Login] User object has required fields (id, username, role)", () => { pm.expect(json.user).to.have.property("id"); pm.expect(json.user).to.have.property("username"); pm.expect(json.user).to.have.property("role"); pm.expect(json.user.id).to.be.a("number"); pm.expect(json.user.username).to.be.a("string").and.not.empty; });
      // --- 3. Variable Chaining ---
      pm.test("[Login] authToken is set in collection variables", () => { pm.expect(json.token).to.be.a("string").and.not.empty; pm.collectionVariables.set("authToken", json.token); pm.expect(pm.collectionVariables.get("authToken")).to.equal(json.token); });
      if (json.user && json.user.id) { pm.collectionVariables.set("loggedInUserId", String(json.user.id)); }