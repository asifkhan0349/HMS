$kind: http-request
name: Forgot Password
method: POST
url: '{{baseUrl}}/api/auth/forgot-password'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "test@hospital.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // --- Helpers ---
      const res    = pm.response;
      const json   = res.json();
      const SLA_MS = 2000;
      // --- 1. Status & Protocol ---
      pm.test("[Forgot Password] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Forgot Password] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Forgot Password] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      // --- 2. Schema Assertions ---
      pm.test("[Forgot Password] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Forgot Password] Response contains 'message' or 'detail'", () => { const hasMessage = json.hasOwnProperty("message"); const hasDetail = json.hasOwnProperty("detail"); pm.expect(hasMessage || hasDetail).to.be.true; });