$kind: http-request
name: Update Staff
method: PUT
url: '{{baseUrl}}/api/staff/{{staffId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "phone": "555-0201",
      "specialization": "Senior Cardiologist"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Update Staff] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Update Staff] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Update Staff] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Update Staff] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Update Staff] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Update Staff] Response has required staff fields", () => {
          pm.expect(json).to.have.property("name");
          pm.expect(json).to.have.property("role");
      });