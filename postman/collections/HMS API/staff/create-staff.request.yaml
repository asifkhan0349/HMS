$kind: http-request
name: Create Staff
method: POST
url: '{{baseUrl}}/api/staff'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Dr. Jane Smith",
      "role": "doctor",
      "department": "Cardiology",
      "phone": "555-0200",
      "email": "jane.smith@hospital.com",
      "specialization": "Cardiologist"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Create Staff] Status code is 201", () => { res.to.have.status(201); });
      pm.test("[Create Staff] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Create Staff] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Create Staff] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Create Staff] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Create Staff] Response has required staff fields", () => {
          pm.expect(json).to.have.property("name");
          pm.expect(json).to.have.property("role");
          pm.expect(json).to.have.property("email");
          pm.expect(json.name).to.be.a("string").and.not.empty;
          pm.expect(json.role).to.be.a("string").and.not.empty;
          pm.expect(json.email).to.be.a("string").and.include("@");
      });
      pm.test("[Create Staff] Role is a valid staff role", () => {
          const validRoles = ["doctor", "nurse", "admin", "technician", "receptionist"];
          pm.expect(validRoles).to.include(json.role);
      });
      pm.test("[Create Staff] Response has created_at timestamp", () => {
          const hasTimestamp = json.hasOwnProperty("created_at") || json.hasOwnProperty("createdAt");
          pm.expect(hasTimestamp, "Expected created_at or createdAt").to.be.true;
      });
      pm.test("[Create Staff] staffId is set in collection variables", () => {
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("staffId", String(json.id));
          pm.collectionVariables.set("lastResourceId", String(json.id));
          pm.expect(pm.collectionVariables.get("staffId")).to.equal(String(json.id));
      });