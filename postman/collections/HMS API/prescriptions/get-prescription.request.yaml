$kind: http-request
name: Get Prescription
method: GET
url: '{{baseUrl}}/api/prescriptions/{{prescriptionId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Get Prescription] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Get Prescription] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Get Prescription] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Get Prescription] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Get Prescription] Response has 'id' matching prescriptionId variable", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
          const storedId = pm.collectionVariables.get("prescriptionId");
          if (storedId) { pm.expect(String(json.id)).to.equal(storedId); }
      });
      pm.test("[Get Prescription] Response has required prescription fields", () => {
          pm.expect(json).to.have.property("patient_id");
          pm.expect(json).to.have.property("medication");
          pm.expect(json).to.have.property("dosage");
          pm.expect(json).to.have.property("frequency");
      });