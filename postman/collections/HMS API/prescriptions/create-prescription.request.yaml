$kind: http-request
name: Create Prescription
method: POST
url: '{{baseUrl}}/api/prescriptions'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "patient_id": 1,
      "doctor_id": 1,
      "medication": "Lisinopril",
      "dosage": "10mg",
      "frequency": "once daily",
      "duration": "30 days",
      "notes": "Take with food"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Create Prescription] Status code is 201", () => { res.to.have.status(201); });
      pm.test("[Create Prescription] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Create Prescription] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Create Prescription] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Create Prescription] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Create Prescription] Response has required prescription fields", () => {
          pm.expect(json).to.have.property("patient_id");
          pm.expect(json).to.have.property("doctor_id");
          pm.expect(json).to.have.property("medication");
          pm.expect(json).to.have.property("dosage");
          pm.expect(json).to.have.property("frequency");
          pm.expect(json.medication).to.be.a("string").and.not.empty;
          pm.expect(json.dosage).to.be.a("string").and.not.empty;
      });
      pm.test("[Create Prescription] Response has created_at timestamp", () => {
          const hasTimestamp = json.hasOwnProperty("created_at") || json.hasOwnProperty("createdAt");
          pm.expect(hasTimestamp, "Expected created_at or createdAt").to.be.true;
      });
      pm.test("[Create Prescription] prescriptionId is set in collection variables", () => {
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("prescriptionId", String(json.id));
          pm.collectionVariables.set("lastResourceId", String(json.id));
          pm.expect(pm.collectionVariables.get("prescriptionId")).to.equal(String(json.id));
      });