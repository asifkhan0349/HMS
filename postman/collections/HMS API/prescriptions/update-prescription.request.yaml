$kind: http-request
name: Update Prescription
method: PUT
url: '{{baseUrl}}/api/prescriptions/{{prescriptionId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "dosage": "20mg",
      "frequency": "twice daily"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Update Prescription] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Update Prescription] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Update Prescription] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Update Prescription] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Update Prescription] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Update Prescription] Updated dosage is reflected in response", () => {
          pm.expect(json).to.have.property("dosage");
          pm.expect(json.dosage).to.equal("20mg");
      });
      pm.test("[Update Prescription] Updated frequency is reflected in response", () => {
          pm.expect(json).to.have.property("frequency");
          pm.expect(json.frequency).to.equal("twice daily");
      });