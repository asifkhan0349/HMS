$kind: http-request
name: List Prescriptions
method: GET
url: '{{baseUrl}}/api/prescriptions'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[List Prescriptions] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[List Prescriptions] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[List Prescriptions] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[List Prescriptions] Response is an array", () => { pm.expect(json).to.be.an("array"); });
      pm.test("[List Prescriptions] Each prescription has required fields", () => {
          if (json.length > 0) {
              const rx = json[0];
              pm.expect(rx).to.have.property("id");
              pm.expect(rx).to.have.property("patient_id");
              pm.expect(rx).to.have.property("medication");
              pm.expect(rx.id).to.be.a("number");
          }
      });
      pm.test("[List Prescriptions] Array items have numeric ids", () => {
          json.forEach((item, idx) => { pm.expect(item.id, "item[" + idx + "].id").to.be.a("number"); });
      });
      if (json.length > 0) { pm.collectionVariables.set("lastResourceId", String(json[0].id)); }