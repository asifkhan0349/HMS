$kind: http-request
name: Get Nurse
method: GET
url: '{{baseUrl}}/api/nurses/{{nurseId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Get Nurse] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Get Nurse] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Get Nurse] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Get Nurse] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Get Nurse] Response has 'id' matching nurseId variable", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
          const storedId = pm.collectionVariables.get("nurseId");
          if (storedId) { pm.expect(String(json.id)).to.equal(storedId); }
      });
      pm.test("[Get Nurse] Response has required nurse fields", () => {
          pm.expect(json).to.have.property("name");
          pm.expect(json).to.have.property("department");
          pm.expect(json).to.have.property("shift");
      });