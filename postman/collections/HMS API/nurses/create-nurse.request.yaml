$kind: http-request
name: Create Nurse
method: POST
url: '{{baseUrl}}/api/nurses'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Nurse Mary Johnson",
      "department": "General",
      "phone": "555-0300",
      "email": "mary.johnson@hospital.com",
      "shift": "morning"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Create Nurse] Status code is 201", () => { res.to.have.status(201); });
      pm.test("[Create Nurse] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Create Nurse] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Create Nurse] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Create Nurse] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Create Nurse] Response has required nurse fields", () => {
          pm.expect(json).to.have.property("name");
          pm.expect(json).to.have.property("department");
          pm.expect(json).to.have.property("shift");
          pm.expect(json).to.have.property("email");
          pm.expect(json.name).to.be.a("string").and.not.empty;
          pm.expect(json.email).to.be.a("string").and.include("@");
      });
      pm.test("[Create Nurse] Shift is a valid shift value", () => {
          const validShifts = ["morning", "afternoon", "evening", "night"];
          pm.expect(validShifts).to.include(json.shift);
      });
      pm.test("[Create Nurse] Response has created_at timestamp", () => {
          const hasTimestamp = json.hasOwnProperty("created_at") || json.hasOwnProperty("createdAt");
          pm.expect(hasTimestamp, "Expected created_at or createdAt").to.be.true;
      });
      pm.test("[Create Nurse] nurseId is set in collection variables", () => {
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("nurseId", String(json.id));
          pm.collectionVariables.set("lastResourceId", String(json.id));
          pm.expect(pm.collectionVariables.get("nurseId")).to.equal(String(json.id));
      });