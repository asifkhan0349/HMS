$kind: http-request
name: Update Nurse
method: PUT
url: '{{baseUrl}}/api/nurses/{{nurseId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "shift": "evening",
      "phone": "555-0301"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Update Nurse] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Update Nurse] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Update Nurse] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Update Nurse] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Update Nurse] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Update Nurse] Updated shift is reflected in response", () => {
          pm.expect(json).to.have.property("shift");
          pm.expect(json.shift).to.equal("evening");
      });