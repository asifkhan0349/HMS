$kind: http-request
name: Update Invoice
method: PUT
url: '{{baseUrl}}/api/invoices/{{invoiceId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "paid",
      "amount": 300.00
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Update Invoice] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Update Invoice] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Update Invoice] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Update Invoice] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Update Invoice] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Update Invoice] Updated status is reflected in response", () => {
          pm.expect(json).to.have.property("status");
          pm.expect(json.status).to.equal("paid");
      });
      pm.test("[Update Invoice] Updated amount is reflected in response", () => {
          pm.expect(json).to.have.property("amount");
          pm.expect(json.amount).to.equal(300);
      });