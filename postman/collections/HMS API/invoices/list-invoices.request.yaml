$kind: http-request
name: List Invoices
method: GET
url: '{{baseUrl}}/api/invoices'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[List Invoices] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[List Invoices] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[List Invoices] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[List Invoices] Response is an array", () => { pm.expect(json).to.be.an("array"); });
      pm.test("[List Invoices] Each invoice has required fields", () => {
          if (json.length > 0) {
              const inv = json[0];
              pm.expect(inv).to.have.property("id");
              pm.expect(inv).to.have.property("patient_id");
              pm.expect(inv).to.have.property("amount");
              pm.expect(inv).to.have.property("status");
              pm.expect(inv.id).to.be.a("number");
              pm.expect(inv.amount).to.be.a("number").and.above(0);
          }
      });
      pm.test("[List Invoices] Array items have numeric ids", () => {
          json.forEach((item, idx) => { pm.expect(item.id, "item[" + idx + "].id").to.be.a("number"); });
      });
      if (json.length > 0) { pm.collectionVariables.set("lastResourceId", String(json[0].id)); }