$kind: http-request
name: Create Invoice
method: POST
url: '{{baseUrl}}/api/invoices'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "patient_id": 1,
      "amount": 250.00,
      "status": "pending",
      "description": "Consultation fee"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Create Invoice] Status code is 201", () => { res.to.have.status(201); });
      pm.test("[Create Invoice] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Create Invoice] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Create Invoice] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Create Invoice] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Create Invoice] Response has required invoice fields", () => {
          pm.expect(json).to.have.property("patient_id");
          pm.expect(json).to.have.property("amount");
          pm.expect(json).to.have.property("status");
          pm.expect(json.patient_id).to.be.a("number");
          pm.expect(json.amount).to.be.a("number").and.above(0);
          pm.expect(json.status).to.equal("pending");
      });
      pm.test("[Create Invoice] Response has created_at timestamp", () => {
          const hasTimestamp = json.hasOwnProperty("created_at") || json.hasOwnProperty("createdAt");
          pm.expect(hasTimestamp, "Expected created_at or createdAt").to.be.true;
      });
      pm.test("[Create Invoice] invoiceId is set in collection variables", () => {
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("invoiceId", String(json.id));
          pm.collectionVariables.set("lastResourceId", String(json.id));
          pm.expect(pm.collectionVariables.get("invoiceId")).to.equal(String(json.id));
      });