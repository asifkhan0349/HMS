$kind: http-request
name: Get Invoice
method: GET
url: '{{baseUrl}}/api/invoices/{{invoiceId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Get Invoice] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Get Invoice] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Get Invoice] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Get Invoice] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Get Invoice] Response has 'id' matching invoiceId variable", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
          const storedId = pm.collectionVariables.get("invoiceId");
          if (storedId) { pm.expect(String(json.id)).to.equal(storedId); }
      });
      pm.test("[Get Invoice] Response has required invoice fields", () => {
          pm.expect(json).to.have.property("patient_id");
          pm.expect(json).to.have.property("amount");
          pm.expect(json).to.have.property("status");
          pm.expect(json.amount).to.be.a("number").and.above(0);
      });
      pm.test("[Get Invoice] Status is a valid invoice status", () => {
          const validStatuses = ["pending", "paid", "cancelled", "overdue"];
          pm.expect(validStatuses).to.include(json.status);
      });