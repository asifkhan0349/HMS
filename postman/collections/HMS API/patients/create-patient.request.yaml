$kind: http-request
name: Create Patient
method: POST
url: '{{baseUrl}}/api/patients'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe",
      "age": 35,
      "gender": "male",
      "phone": "555-0100",
      "email": "john.doe@example.com",
      "address": "123 Main St",
      "blood_group": "O+"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // â”€â”€â”€ Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      const res    = pm.response;
      const json   = res.json();
      const SLA_MS = 2000;

      // â”€â”€â”€ 1. Status & Protocol â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[Create Patient] Status code is 201", () => {
          res.to.have.status(201);
      });

      pm.test("[Create Patient] Content-Type is application/json", () => {
          pm.expect(res.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("[Create Patient] Response time is within SLA (" + SLA_MS + "ms)", () => {
          pm.expect(res.responseTime).to.be.below(SLA_MS);
      });

      // â”€â”€â”€ 2. Schema Assertions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[Create Patient] Response body is a JSON object", () => {
          pm.expect(json).to.be.an("object");
      });

      pm.test("[Create Patient] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });

      pm.test("[Create Patient] Response has required patient fields", () => {
          pm.expect(json).to.have.property("name");
          pm.expect(json).to.have.property("age");
          pm.expect(json).to.have.property("gender");
          pm.expect(json.name).to.be.a("string").and.not.empty;
          pm.expect(json.age).to.be.a("number").and.above(0);
      });

      pm.test("[Create Patient] Response has contact fields", () => {
          pm.expect(json).to.have.property("phone");
          pm.expect(json).to.have.property("email");
          pm.expect(json.email).to.be.a("string").and.include("@");
      });

      pm.test("[Create Patient] Response has created_at timestamp", () => {
          const hasTimestamp = json.hasOwnProperty("created_at") || json.hasOwnProperty("createdAt");
          pm.expect(hasTimestamp, "Expected created_at or createdAt").to.be.true;
      });

      // â”€â”€â”€ 3. Variable Chaining â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[Create Patient] patientId is set in collection variables", () => {
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("patientId", String(json.id));
          pm.collectionVariables.set("lastResourceId", String(json.id));
          pm.expect(pm.collectionVariables.get("patientId")).to.equal(String(json.id));
      });