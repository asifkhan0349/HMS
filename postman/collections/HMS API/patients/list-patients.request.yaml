$kind: http-request
name: List Patients
method: GET
url: '{{baseUrl}}/api/patients'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // â”€â”€â”€ Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      const res    = pm.response;
      const json   = res.json();
      const SLA_MS = 2000;

      // â”€â”€â”€ 1. Status & Protocol â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[List Patients] Status code is 200", () => {
          res.to.have.status(200);
      });

      pm.test("[List Patients] Content-Type is application/json", () => {
          pm.expect(res.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("[List Patients] Response time is within SLA (" + SLA_MS + "ms)", () => {
          pm.expect(res.responseTime).to.be.below(SLA_MS);
      });

      // â”€â”€â”€ 2. Schema Assertions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[List Patients] Response is an array", () => {
          pm.expect(json).to.be.an("array");
      });

      pm.test("[List Patients] Each patient has required fields", () => {
          if (json.length > 0) {
              const patient = json[0];
              pm.expect(patient).to.have.property("id");
              pm.expect(patient).to.have.property("name");
              pm.expect(patient.id).to.be.a("number");
              pm.expect(patient.name).to.be.a("string").and.not.empty;
          }
      });

      pm.test("[List Patients] Array items have numeric ids", () => {
          json.forEach((item, idx) => {
              pm.expect(item.id, "item[" + idx + "].id").to.be.a("number");
          });
      });

      // â”€â”€â”€ 3. Variable Chaining â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      if (json.length > 0) {
          pm.collectionVariables.set("lastResourceId", String(json[0].id));
      }