$kind: http-request
name: Get Patient
method: GET
url: '{{baseUrl}}/api/patients/{{patientId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // â”€â”€â”€ Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      const res    = pm.response;
      const json   = res.json();
      const SLA_MS = 2000;

      // â”€â”€â”€ 1. Status & Protocol â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[Get Patient] Status code is 200", () => {
          res.to.have.status(200);
      });

      pm.test("[Get Patient] Content-Type is application/json", () => {
          pm.expect(res.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("[Get Patient] Response time is within SLA (" + SLA_MS + "ms)", () => {
          pm.expect(res.responseTime).to.be.below(SLA_MS);
      });

      // â”€â”€â”€ 2. Schema Assertions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[Get Patient] Response body is a JSON object", () => {
          pm.expect(json).to.be.an("object");
      });

      pm.test("[Get Patient] Response has 'id' matching patientId variable", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
          const storedId = pm.collectionVariables.get("patientId");
          if (storedId) {
              pm.expect(String(json.id)).to.equal(storedId);
          }
      });

      pm.test("[Get Patient] Response has required patient fields", () => {
          pm.expect(json).to.have.property("name");
          pm.expect(json).to.have.property("age");
          pm.expect(json).to.have.property("gender");
          pm.expect(json.name).to.be.a("string").and.not.empty;
      });

      pm.test("[Get Patient] Response has contact fields", () => {
          pm.expect(json).to.have.property("phone");
          pm.expect(json).to.have.property("email");
      });