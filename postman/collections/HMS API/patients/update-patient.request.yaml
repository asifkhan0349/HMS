$kind: http-request
name: Update Patient
method: PUT
url: '{{baseUrl}}/api/patients/{{patientId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe Updated",
      "age": 36,
      "phone": "555-0101"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // â”€â”€â”€ Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      const res    = pm.response;
      const json   = res.json();
      const SLA_MS = 2000;

      // â”€â”€â”€ 1. Status & Protocol â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[Update Patient] Status code is 200", () => {
          res.to.have.status(200);
      });

      pm.test("[Update Patient] Content-Type is application/json", () => {
          pm.expect(res.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("[Update Patient] Response time is within SLA (" + SLA_MS + "ms)", () => {
          pm.expect(res.responseTime).to.be.below(SLA_MS);
      });

      // â”€â”€â”€ 2. Schema Assertions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pm.test("[Update Patient] Response body is a JSON object", () => {
          pm.expect(json).to.be.an("object");
      });

      pm.test("[Update Patient] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });

      pm.test("[Update Patient] Updated fields are reflected in response", () => {
          pm.expect(json).to.have.property("name");
          pm.expect(json).to.have.property("age");
          pm.expect(json.name).to.equal("John Doe Updated");
          pm.expect(json.age).to.equal(36);
      });

      pm.test("[Update Patient] Response has updated_at or created_at timestamp", () => {
          const hasTimestamp = json.hasOwnProperty("updated_at") || json.hasOwnProperty("updatedAt") || json.hasOwnProperty("created_at");
          pm.expect(hasTimestamp, "Expected a timestamp field").to.be.true;
      });