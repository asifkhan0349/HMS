$kind: http-request
name: Update Record
method: PUT
url: '{{baseUrl}}/api/records/{{recordId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "diagnosis": "Hypertension - Controlled",
      "treatment": "Continued medication"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Update Record] Status code is 200", () => { res.to.have.status(200); });
      pm.test("[Update Record] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Update Record] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Update Record] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Update Record] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Update Record] Updated diagnosis is reflected in response", () => {
          pm.expect(json).to.have.property("diagnosis");
          pm.expect(json.diagnosis).to.equal("Hypertension - Controlled");
      });