$kind: http-request
name: Create Record
method: POST
url: '{{baseUrl}}/api/records'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "patient_id": 1,
      "doctor_id": 1,
      "diagnosis": "Hypertension",
      "treatment": "Medication prescribed",
      "notes": "Follow up in 2 weeks"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response;
      const json = res.json();
      const SLA_MS = 2000;
      pm.test("[Create Record] Status code is 201", () => { res.to.have.status(201); });
      pm.test("[Create Record] Content-Type is application/json", () => { pm.expect(res.headers.get("Content-Type")).to.include("application/json"); });
      pm.test("[Create Record] Response time is within SLA (" + SLA_MS + "ms)", () => { pm.expect(res.responseTime).to.be.below(SLA_MS); });
      pm.test("[Create Record] Response body is a JSON object", () => { pm.expect(json).to.be.an("object"); });
      pm.test("[Create Record] Response has 'id' as a number", () => {
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });
      pm.test("[Create Record] Response has required medical record fields", () => {
          pm.expect(json).to.have.property("patient_id");
          pm.expect(json).to.have.property("doctor_id");
          pm.expect(json).to.have.property("diagnosis");
          pm.expect(json).to.have.property("treatment");
          pm.expect(json.patient_id).to.be.a("number");
          pm.expect(json.diagnosis).to.be.a("string").and.not.empty;
      });
      pm.test("[Create Record] Response has created_at timestamp", () => {
          const hasTimestamp = json.hasOwnProperty("created_at") || json.hasOwnProperty("createdAt");
          pm.expect(hasTimestamp, "Expected created_at or createdAt").to.be.true;
      });
      pm.test("[Create Record] recordId is set in collection variables", () => {
          pm.expect(json.id).to.be.a("number");
          pm.collectionVariables.set("recordId", String(json.id));
          pm.collectionVariables.set("lastResourceId", String(json.id));
          pm.expect(pm.collectionVariables.get("recordId")).to.equal(String(json.id));
      });