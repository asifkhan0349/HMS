stages:
  - lint
  - test
  - build

variables:
  # Using Node 20 as it's the current LTS and widely compatible
  NODE_IMAGE: node:20-alpine
  # Using Python 3.11 for the FastAPI backend
  PYTHON_IMAGE: python:3.11-slim
  # Skip browser downloads for Playwright/Puppeteer (not needed in CI build)
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

# ---- FRONTEND JOBS ----

frontend:lint:
  image: $NODE_IMAGE
  stage: lint
  script:
    - npm ci
    - npm run lint
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push

frontend:build:
  image: $NODE_IMAGE
  stage: build
  script:
    - npm ci
    - npm run build:ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

landing:build:
  image: $NODE_IMAGE
  stage: build
  script:
    - cd landing
    - npm ci
    - npm run build
  artifacts:
    paths:
      - landing/dist/
    expire_in: 1 week

# ---- BACKEND JOBS ----

backend:test:
  image: $PYTHON_IMAGE
  stage: test
  variables:
    # Ensure stdout/stderr are unbuffered
    PYTHONUNBUFFERED: 1
    # Ensure the backend directory is in the python path
    PYTHONPATH: "."
  before_script:
    - cd backend
    - apt-get update && apt-get install -y libpq-dev gcc # Required for psycopg2
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip list # Diagnostic: confirm installed packages and versions
    - pwd # Diagnostic: confirm current directory
  script:
    # Improved sanity check with traceback reporting to diagnose import failures
    - |
      python -c "
      import sys
      import os
      import traceback
      print(f'PYTHONPATH: {os.environ.get(\"PYTHONPATH\")}')
      print(f'sys.path: {sys.path}')
      try:
          from app import main
          print('Backend sanity check passed')
      except Exception:
          traceback.print_exc()
          sys.exit(1)
      "
    # Add your test commands here (e.g., pytest) when tests are available
    # - pytest
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - ~/.cache/pip
